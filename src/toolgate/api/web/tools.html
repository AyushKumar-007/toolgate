<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>toolgate · Tools Desktop</title>
    <link rel="stylesheet" href="/static/desktop.css" />
  </head>
  <body class="desk tools-desk">
    <header>
      <div>
        <p class="kicker">Desktop app</p>
        <h1>Tools</h1>
      </div>
      <div class="status-pill" id="pill">idle</div>
    </header>
    <main>
      <section class="stage-banner" id="stageBanner">
        <div class="orbit" aria-hidden="true"></div>
        <p class="stage-title" id="stageTitle">Waiting for gateway</p>
        <p class="stage-sub" id="stageSub">This window opens only after the gateway allows the call.</p>
      </section>

      <section class="card">
        <h2>Gateway gate</h2>
        <p id="gate">No tool execution until ALLOW.</p>
      </section>
      <section class="card glow" id="decisionCard">
        <h2>Decision</h2>
        <pre id="decision" class="mono">·</pre>
      </section>
      <section class="card">
        <h2>Tool results</h2>
        <pre id="results" class="mono">·</pre>
      </section>
      <section class="card">
        <h2>Store snapshot</h2>
        <pre id="store" class="mono">·</pre>
      </section>
      <section class="card">
        <h2>Available tools</h2>
        <div id="catalog" class="chips"></div>
      </section>
    </main>
    <script src="/static/desktop-tools.js?v=6"></script>
  </body>
</html>
